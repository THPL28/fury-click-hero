name: Bug report
description: Report a defect or regression
title: "fix(scope): "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Explain severity and affected users or flows.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Branch, version, environment, logs, screenshots.
